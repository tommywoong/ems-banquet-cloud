version: "3.9"

services:
  ems-banquet-cloud:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ems_banquet_cloud
    restart: always
    ports:
      - "5090:8080"
    environment:
      - EMS_DB_MODE=${EMS_DB_MODE:-google_sheets}
      - EMS_GSHEET_ID=${EMS_GSHEET_ID:-}
      - EMS_GSHEET_WEBHOOK_URL=${EMS_GSHEET_WEBHOOK_URL:-}
      - PORT=8080
    volumes:
      - ../../ems-web/data:/app/ems-web/data
      - ../../config.json:/app/config.json
